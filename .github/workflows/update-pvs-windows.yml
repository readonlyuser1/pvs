name: update-pvs-windows

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-pvs-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive-pvs-studio:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Скачать установщик PVS-Studio
        shell: pwsh
        run: |
          curl.exe -L --retry 3 --retry-delay 5 `
            -o "$env:TEMP\PVS-Studio_setup.exe" `
            'https://cdn.pvs-studio.com/PVS-Studio_setup.exe'

      - name: Установить PVS-Studio в тихом режиме
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$env:TEMP\PVS-Studio_setup.exe" `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
            -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Установщик завершился с кодом $($proc.ExitCode)" }

      - name: Определить полную версию установленной сборки
        shell: pwsh
        run: |
          $cmdPath = 'C:\Program Files (x86)\PVS-Studio\PVS-Studio_Cmd.exe'
          if (-not (Test-Path $cmdPath)) { throw "Не найден $cmdPath — установка не удалась" }
          $fullVersion = (Get-Item $cmdPath).VersionInfo.ProductVersion
          if ($fullVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "ProductVersion '$fullVersion' имеет неожиданный формат — ожидается ровно четыре числа через точку (например, 7.43.107165.412). Проверьте свойства $cmdPath."
          }
          $tagVersion = ($fullVersion -split '\.')[0..2] -join '.'
          "FULL_VERSION=$fullVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Проверить, не заархивирован ли уже этот билд
        id: check-existing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          $apiBase = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_VERSION"
          $assetName = "PVS-Studio-portable-$env:FULL_VERSION.tgz"
          try {
            $release = Invoke-RestMethod -Uri $apiBase -Headers $headers -Method Get
            if ($release.assets | Where-Object { $_.name -eq $assetName }) {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "Релиз $env:TAG_VERSION уже содержит $assetName — пропускаем."
            } else {
              "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
          } catch {
            if ($_.Exception.Response.StatusCode -eq 404) {
              "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else { throw }
          }

      - name: Собрать portable-архив и контрольную сумму
        if: steps.check-existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tgz = "PVS-Studio-portable-$env:FULL_VERSION.tgz"
          tar -czf $tgz -C 'C:\Program Files (x86)' PVS-Studio
          $hash = (Get-FileHash -Path $tgz -Algorithm SHA256).Hash
          "$hash  $tgz" | Out-File -FilePath "$tgz.sha256" -Encoding ascii

      - name: Проверить содержимое архива
        if: steps.check-existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tgz = "PVS-Studio-portable-$env:FULL_VERSION.tgz"
          $entries = tar -tzf $tgz
          if (-not ($entries | Select-String -Pattern '^PVS-Studio/PVS-Studio_Cmd\.exe$')) {
            throw "Архив $tgz не содержит PVS-Studio/PVS-Studio_Cmd.exe — упаковка битая.`nСодержимое архива:`n$($entries -join "`n")"
          }
          Write-Host "Архив содержит ожидаемый PVS-Studio/PVS-Studio_Cmd.exe"

      - name: Создать релиз и залить ассеты
        if: steps.check-existing.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tgz = "PVS-Studio-portable-$env:FULL_VERSION.tgz"
          $plugins = Get-ChildItem -Path 'C:\Program Files (x86)\PVS-Studio' -Filter 'sonar-pvs-studio-*.jar'
          if (-not $plugins) {
            throw 'Не найдено ни одного sonar-pvs-studio-*.jar: релиз без плагинов бесполезен.'
          }
          $files = @($tgz, "$tgz.sha256") + $plugins.FullName

          $repo = $env:GITHUB_REPOSITORY

          gh release view $env:TAG_VERSION --repo $repo *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {
            gh release create $env:TAG_VERSION --repo $repo --title "PVS-Studio $env:TAG_VERSION" --generate-notes $files
            if ($LASTEXITCODE -ne 0) { throw "gh release create вернул ${LASTEXITCODE}: релиз $env:TAG_VERSION не создан" }
            Write-Host "Релиз $env:TAG_VERSION создан, ассеты залиты"
          } else {
            $existingAssets = @(gh release view $env:TAG_VERSION --repo $repo --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "gh release view вернул ${LASTEXITCODE}: список ассетов не получен" }
            foreach ($file in $files) {
              $assetName = Split-Path $file -Leaf
              if ($existingAssets -contains $assetName) {
                Write-Host "Ассет $assetName уже залит, пропускаю"
                continue
              }
              gh release upload $env:TAG_VERSION $file --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "gh release upload $assetName вернул $LASTEXITCODE" }
              Write-Host "Загружен $assetName"
            }
          }

          $final = @(gh release view $env:TAG_VERSION --repo $repo --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "gh release view вернул ${LASTEXITCODE}: проверить релиз не удалось" }
          if ($final -notcontains $tgz) {
            throw "В релизе $env:TAG_VERSION нет $tgz. Сейчас там: $($final -join ', ')"
          }
          Write-Host "Проверено: релиз $env:TAG_VERSION содержит $($final -join ', ')"
