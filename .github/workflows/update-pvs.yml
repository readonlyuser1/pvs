name: update-pvs
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-pvs
  cancel-in-progress: false

permissions:
  contents: write

env:
  VENDOR_JAVA_CORE_BASE_URL: 'https://files.pvs-studio.com/java/pvsstudio-cores'
  VENDOR_WINDOWS_INSTALLER_URL: 'https://cdn.pvs-studio.com/PVS-Studio_setup.exe'
  MAVEN_PLUGIN_BASE_URL: 'https://repo1.maven.org/maven2/com/pvsstudio/pvsstudio-maven-plugin'
  WINDOWS_INSTALL_DIR: 'C:\Program Files (x86)\PVS-Studio'
  UNWANTED_PLUGIN_JAR_PATTERN: '*old-versions-before-10.2*'

jobs:
  publish-single-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Read published java version and download its analyzer core
        id: java-package
        shell: pwsh
        run: |
          $metadataUrl = "$env:MAVEN_PLUGIN_BASE_URL/maven-metadata.xml"
          $metadata = [xml](Invoke-WebRequest -Uri $metadataUrl -UseBasicParsing -TimeoutSec 30).Content
          $javaAnalyzerVersion = $metadata.metadata.versioning.release
          if (-not $javaAnalyzerVersion) { $javaAnalyzerVersion = $metadata.metadata.versioning.latest }
          if ($javaAnalyzerVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "В $metadataUrl версия '$javaAnalyzerVersion' не похожа на три числа через точку — тег релиза и имя ассета получились бы мусорными"
          }
          Write-Host "Опубликованная версия java-анализатора: $javaAnalyzerVersion"

          $releaseAssetName = "$javaAnalyzerVersion.zip"
          $coreUrl = "$env:VENDOR_JAVA_CORE_BASE_URL/$releaseAssetName"
          $corePath = Join-Path $env:GITHUB_WORKSPACE $releaseAssetName
          curl.exe -L --retry 3 --retry-delay 5 -o $corePath $coreUrl
          if (-not (Test-Path $corePath)) {
            throw "Не скачалось ядро анализатора: $coreUrl"
          }
          $downloadedBytes = (Get-Item $corePath).Length
          if ($downloadedBytes -lt 10MB) {
            throw "Ядро весит $downloadedBytes байт — вендор отдал не архив, публиковать нельзя ($coreUrl)"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($corePath)
          try {
            $topLevelNames = [string[]]@(
              $archive.Entries.FullName |
                ForEach-Object { ($_ -split '/')[0] } |
                Where-Object { $_ } |
                Sort-Object -Unique
            )
          } finally {
            $archive.Dispose()
          }
          if ($topLevelNames.Count -ne 1 -or $topLevelNames[0] -ne $javaAnalyzerVersion) {
            throw "Внутри ядра ожидался единственный каталог '$javaAnalyzerVersion', а лежит: $($topLevelNames -join ', '). Kanico распаковывает архив прямо в ~/.config/PVS-Studio-Java, и при другой раскладке maven-плагин ядро не найдёт и потянет своё из интернета."
          }
          Write-Host "Ассет $releaseAssetName собран: $([math]::Round($downloadedBytes/1MB)) МБ, внутри каталог $javaAnalyzerVersion"
          "java_version=$javaAnalyzerVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "java_asset=$releaseAssetName"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check that maven plugin of the same version is published
        id: maven-check
        shell: pwsh
        env:
          JAVA_VERSION: ${{ steps.java-package.outputs.java_version }}
        run: |
          $mavenPluginUrl = "$env:MAVEN_PLUGIN_BASE_URL/$env:JAVA_VERSION/"
          $mavenPluginPublished = $false
          try {
            Invoke-WebRequest -Uri $mavenPluginUrl -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
            $mavenPluginPublished = $true
          } catch {
            $mavenPluginPublished = $false
          }
          if ($mavenPluginPublished) {
            Write-Host "pvsstudio-maven-plugin:$env:JAVA_VERSION есть в Maven Central — linux-образ соберётся"
          } else {
            Write-Host "::warning::pvsstudio-maven-plugin:$env:JAVA_VERSION в Maven Central ещё нет ($mavenPluginUrl) — java-скан в linux-образе упадёт на разрешении плагина, пока вендор не опубликует артефакт"
          }
          "maven_plugin_published=$mavenPluginPublished" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install windows build and read its full version
        id: windows-build
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'PVS-Studio_setup.exe'
          curl.exe -L --retry 3 --retry-delay 5 -o $installerPath $env:VENDOR_WINDOWS_INSTALLER_URL
          $installer = Start-Process -FilePath $installerPath `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            throw "Установщик PVS-Studio завершился с кодом $($installer.ExitCode)"
          }
          $analyzerExePath = Join-Path $env:WINDOWS_INSTALL_DIR 'PVS-Studio_Cmd.exe'
          if (-not (Test-Path $analyzerExePath)) {
            throw "После установки нет $analyzerExePath"
          }
          $windowsFullVersion = (Get-Item $analyzerExePath).VersionInfo.ProductVersion
          if ($windowsFullVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "ProductVersion '$windowsFullVersion' не похож на версию сборки (ожидается четыре числа через точку) — имя ассета получилось бы мусорным"
          }
          Write-Host "Версия windows-сборки: $windowsFullVersion"
          "windows_version=$windowsFullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack portable archive with checksum
        id: portable
        shell: pwsh
        env:
          WINDOWS_VERSION: ${{ steps.windows-build.outputs.windows_version }}
        run: |
          $portableArchiveName = "PVS-Studio-portable-$env:WINDOWS_VERSION.tgz"
          $installRoot = Split-Path $env:WINDOWS_INSTALL_DIR -Parent
          $installLeaf = Split-Path $env:WINDOWS_INSTALL_DIR -Leaf
          tar -czf $portableArchiveName -C $installRoot $installLeaf
          if ($LASTEXITCODE -ne 0) { throw "tar завершился с кодом $LASTEXITCODE" }
          $archiveEntries = tar -tzf $portableArchiveName
          if (-not ($archiveEntries | Select-String -Pattern '^PVS-Studio/PVS-Studio_Cmd\.exe$')) {
            throw "В архиве $portableArchiveName нет PVS-Studio/PVS-Studio_Cmd.exe — win-образ такой архив не примет"
          }
          $checksum = (Get-FileHash -Path $portableArchiveName -Algorithm SHA256).Hash
          "$checksum  $portableArchiveName" | Out-File -FilePath "$portableArchiveName.sha256" -Encoding ascii
          Write-Host "Собран $portableArchiveName ($([math]::Round((Get-Item $portableArchiveName).Length/1MB)) МБ) и его sha256"
          "portable_asset=$portableArchiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Collect sonarqube plugin jars
        id: plugins
        shell: pwsh
        run: |
          $allPluginJars = Get-ChildItem -Path $env:WINDOWS_INSTALL_DIR -Filter 'sonar-pvs-studio-*.jar'
          if (-not $allPluginJars) {
            throw "В поставке нет ни одного sonar-pvs-studio-*.jar — серверу SonarQube нечем обновляться"
          }
          $publishablePluginJars = $allPluginJars | Where-Object { $_.Name -notlike $env:UNWANTED_PLUGIN_JAR_PATTERN }
          $skippedPluginJars = $allPluginJars | Where-Object { $_.Name -like $env:UNWANTED_PLUGIN_JAR_PATTERN }
          foreach ($skipped in $skippedPluginJars) {
            Write-Host "Не публикую $($skipped.Name)"
          }
          if (-not $publishablePluginJars) {
            throw "После отсева остались только неподдерживаемые jar — публиковать нечего"
          }
          foreach ($jar in $publishablePluginJars) {
            Copy-Item -Path $jar.FullName -Destination $env:GITHUB_WORKSPACE -Force
            Write-Host "К публикации: $($jar.Name)"
          }
          ($publishablePluginJars.Name -join "`n") | Out-File -FilePath 'publishable-plugins.txt' -Encoding ascii

      - name: Publish every file into one release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.java-package.outputs.java_version }}
          JAVA_ASSET: ${{ steps.java-package.outputs.java_asset }}
          PORTABLE_ASSET: ${{ steps.portable.outputs.portable_asset }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $pluginAssetNames = Get-Content 'publishable-plugins.txt' | Where-Object { $_ }
          $wantedAssetNames = @($env:JAVA_ASSET, $env:PORTABLE_ASSET, "$env:PORTABLE_ASSET.sha256") + $pluginAssetNames

          gh release view $env:RELEASE_TAG --repo $repository *> $null
          $releaseAlreadyExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseAlreadyExists) {
            gh release create $env:RELEASE_TAG --repo $repository --title "PVS-Studio $env:RELEASE_TAG" --notes "Единый релиз поставки PVS-Studio $env:RELEASE_TAG: java-анализатор, portable-сборка для windows-образа и плагины SonarQube."
            if ($LASTEXITCODE -ne 0) { throw "gh release create вернул ${LASTEXITCODE}: релиз $env:RELEASE_TAG не создан" }
            Write-Host "Создан релиз $env:RELEASE_TAG"
          }

          $presentAssetNames = @(gh release view $env:RELEASE_TAG --repo $repository --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "gh release view вернул ${LASTEXITCODE}: список ассетов не получен" }

          $obsoleteAssetNames = $presentAssetNames | Where-Object {
            $_ -and ($wantedAssetNames -notcontains $_) -and
            ($_ -like 'PVS-Studio-portable-*' -or $_ -like 'sonar-pvs-studio-*.jar' -or $_ -like '*.zip')
          }
          foreach ($obsolete in $obsoleteAssetNames) {
            gh release delete-asset $env:RELEASE_TAG $obsolete --repo $repository --yes
            if ($LASTEXITCODE -ne 0) { throw "gh release delete-asset $obsolete вернул $LASTEXITCODE" }
            Write-Host "Удалён устаревший ассет $obsolete"
          }

          $uploadedAssetNames = @()
          foreach ($assetName in $wantedAssetNames) {
            if ($presentAssetNames -contains $assetName -and $obsoleteAssetNames -notcontains $assetName) {
              Write-Host "Уже в релизе: $assetName"
              continue
            }
            gh release upload $env:RELEASE_TAG $assetName --repo $repository --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload $assetName вернул $LASTEXITCODE" }
            $uploadedAssetNames += $assetName
            Write-Host "Загружен $assetName"
          }
          $finalAssetNames = @(gh release view $env:RELEASE_TAG --repo $repository --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "gh release view вернул ${LASTEXITCODE}: проверить релиз не удалось" }
          $missingAssetNames = $wantedAssetNames | Where-Object { $finalAssetNames -notcontains $_ }
          if ($missingAssetNames) {
            throw "В релизе $env:RELEASE_TAG не хватает: $($missingAssetNames -join ', '). Сейчас там: $($finalAssetNames -join ', ')"
          }
          $unwantedInRelease = $finalAssetNames | Where-Object { $_ -like $env:UNWANTED_PLUGIN_JAR_PATTERN }
          if ($unwantedInRelease) {
            throw "В релизе остался ненужный jar: $($unwantedInRelease -join ', ')"
          }
          Write-Host "Релиз $env:RELEASE_TAG содержит: $($finalAssetNames -join ', ')"
          "uploaded=$($uploadedAssetNames -join ', ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "final=$($finalAssetNames -join ', ')"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Keep only three newest releases
        id: retention
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.java-package.outputs.java_version }}
          RELEASES_TO_KEEP: '3'
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $keepCount = [int]$env:RELEASES_TO_KEEP
          $publishedTags = @(gh release list --repo $repository --limit 200 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "gh release list вернул ${LASTEXITCODE}: список релизов не получен" }

          $sortableReleases = @()
          $unsortableTags = @()
          foreach ($tag in $publishedTags) {
            $parsedVersion = $null
            if ([version]::TryParse($tag, [ref]$parsedVersion)) {
              $sortableReleases += [pscustomobject]@{ Tag = $tag; Version = $parsedVersion }
            } else {
              $unsortableTags += $tag
            }
          }
          foreach ($tag in $unsortableTags) {
            Write-Host "Тег $tag не разбирается как версия — не трогаю его"
          }

          $tagsToKeep = @($sortableReleases | Sort-Object Version -Descending | Select-Object -First $keepCount | ForEach-Object { $_.Tag })
          if ($env:RELEASE_TAG -and $tagsToKeep -notcontains $env:RELEASE_TAG) {
            $tagsToKeep += $env:RELEASE_TAG
          }
          $tagsToDelete = @($sortableReleases | Where-Object { $tagsToKeep -notcontains $_.Tag } | Sort-Object Version -Descending | ForEach-Object { $_.Tag })

          Write-Host "Оставляю: $($tagsToKeep -join ', ')"
          foreach ($tag in $tagsToDelete) {
            gh release delete $tag --repo $repository --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "gh release delete $tag вернул $LASTEXITCODE" }
            Write-Host "Удалён релиз $tag вместе с тегом"
          }
          if (-not $tagsToDelete) {
            Write-Host "Лишних релизов нет, удалять нечего"
          }
          "kept=$($tagsToKeep -join ', ')"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deleted=$($tagsToDelete -join ', ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Notify telegram
        if: always()
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULT: ${{ job.status }}
          RELEASE_TAG: ${{ steps.java-package.outputs.java_version }}
          WINDOWS_VERSION: ${{ steps.windows-build.outputs.windows_version }}
          MAVEN_PLUGIN_PUBLISHED: ${{ steps.maven-check.outputs.maven_plugin_published }}
          UPLOADED_ASSETS: ${{ steps.release.outputs.uploaded }}
          KEPT_RELEASES: ${{ steps.retention.outputs.kept }}
          DELETED_RELEASES: ${{ steps.retention.outputs.deleted }}
          JAVA_ASSET: ${{ steps.java-package.outputs.java_asset }}
          PORTABLE_ASSET: ${{ steps.portable.outputs.portable_asset }}
          JAVA_STEP_OUTCOME: ${{ steps.java-package.outcome }}
          MAVEN_STEP_OUTCOME: ${{ steps.maven-check.outcome }}
          WINDOWS_STEP_OUTCOME: ${{ steps.windows-build.outcome }}
          PORTABLE_STEP_OUTCOME: ${{ steps.portable.outcome }}
          PLUGINS_STEP_OUTCOME: ${{ steps.plugins.outcome }}
          RELEASE_STEP_OUTCOME: ${{ steps.release.outcome }}
          RETENTION_STEP_OUTCOME: ${{ steps.retention.outcome }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if (-not $env:TELEGRAM_BOT_TOKEN -or -not $env:TELEGRAM_CHAT_ID) {
            Write-Host "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — уведомление не отправлено"
            exit 0
          }

          $repo   = $env:GITHUB_REPOSITORY
          $server = $env:GITHUB_SERVER_URL
          $runId  = $env:GITHUB_RUN_ID
          $runUrl = "$server/$repo/actions/runs/$runId"

          $relUrl = ''
          if ($env:RELEASE_TAG) { $relUrl = "$server/$repo/releases/tag/$env:RELEASE_TAG" }

          function H([string]$s) {
            if ($null -eq $s) { return '' }
            return $s.Replace('&','&amp;').Replace('<','&lt;').Replace('>','&gt;')
          }
          function Size([long]$b) {
            if ($b -ge 1GB) { return ('{0:N1} ГБ' -f ($b/1GB)) }
            if ($b -ge 1MB) { return ('{0:N0} МБ' -f ($b/1MB)) }
            if ($b -ge 1KB) { return ('{0:N0} КБ' -f ($b/1KB)) }
            return "${b} Б"
          }
          function StepIcon([string]$o) {
            if ($o -eq 'success')   { return '✅' }
            if ($o -eq 'failure')   { return '❌' }
            if ($o -eq 'cancelled') { return '🚫' }
            if ($o -eq 'skipped')   { return '⏭️' }
            return '❔'
          }

          $headerIcon = '⚠️'
          if ($env:JOB_RESULT -eq 'success')   { $headerIcon = '✅' }
          if ($env:JOB_RESULT -eq 'failure')   { $headerIcon = '❌' }
          if ($env:JOB_RESULT -eq 'cancelled') { $headerIcon = '🚫' }

          $title = 'PVS-Studio update-pvs'
          if ($env:RELEASE_TAG) { $title = "PVS-Studio $env:RELEASE_TAG" }

          $subtitle = "статус: $env:JOB_RESULT ❔"
          if ($env:JOB_RESULT -eq 'success') {
            if ($env:UPLOADED_ASSETS) { $subtitle = 'релиз обновлён 🆕' }
            else                      { $subtitle = 'уже полный, менять нечего 👌' }
          }
          if ($env:JOB_RESULT -eq 'failure')   { $subtitle = 'обновление НЕ удалось 💥' }
          if ($env:JOB_RESULT -eq 'cancelled') { $subtitle = 'обновление отменено 🚫' }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("$headerIcon <b>$title</b> — $subtitle")
          $lines.Add('')

          $verParts = @()
          if ($env:RELEASE_TAG)     { $verParts += "📦 Java <code>$(H $env:RELEASE_TAG)</code>" }
          if ($env:WINDOWS_VERSION) { $verParts += "🪟 Windows <code>$(H $env:WINDOWS_VERSION)</code>" }
          if ($verParts.Count -gt 0) {
            $lines.Add(($verParts -join ' · '))
          }

          if ($env:MAVEN_PLUGIN_PUBLISHED -eq 'True') {
            $lines.Add('✅ Maven Central: плагин опубликован')
          }
          if ($env:MAVEN_PLUGIN_PUBLISHED -eq 'False') {
            $lines.Add('⚠️ Maven Central: плагина этой версии ещё нет — java-скан в linux упадёт')
          }
          $lines.Add('')

          $stepNames = @('Java-ядро','Maven','Win-установка','Portable','Плагины','Релиз','Retention')
          $stepOutcomes = @(
            $env:JAVA_STEP_OUTCOME,
            $env:MAVEN_STEP_OUTCOME,
            $env:WINDOWS_STEP_OUTCOME,
            $env:PORTABLE_STEP_OUTCOME,
            $env:PLUGINS_STEP_OUTCOME,
            $env:RELEASE_STEP_OUTCOME,
            $env:RETENTION_STEP_OUTCOME
          )
          $icons = @()
          foreach ($o in $stepOutcomes) { $icons += StepIcon $o }
          $lines.Add("🔧 <b>Шаги:</b> $($icons -join ' ')")

          if ($env:JOB_RESULT -ne 'success') {
            for ($i = 0; $i -lt $stepOutcomes.Count; $i++) {
              if ($stepOutcomes[$i] -eq 'failure') {
                $lines.Add("💥 Сбой на шаге: <b>$($stepNames[$i])</b>")
                break
              }
            }
          }
          $lines.Add('')

          $workspace  = $env:GITHUB_WORKSPACE
          $assetFiles = @()
          if ($env:JAVA_ASSET)     { $assetFiles += $env:JAVA_ASSET }
          if ($env:PORTABLE_ASSET) {
            $assetFiles += $env:PORTABLE_ASSET
            $assetFiles += "$env:PORTABLE_ASSET.sha256"
          }
          $pluginsTxt = Join-Path $workspace 'publishable-plugins.txt'
          if (Test-Path $pluginsTxt) {
            Get-Content $pluginsTxt | Where-Object { $_ } | ForEach-Object { $assetFiles += $_ }
          }

          $totalBytes = 0L
          $assetLines = @()
          foreach ($a in $assetFiles) {
            $p = Join-Path $workspace $a
            if (Test-Path $p) {
              $sz = (Get-Item $p).Length
              $totalBytes += $sz
              $assetLines += "📄 <code>$(H $a)</code> — $(Size $sz)"
            } else {
              $assetLines += "📄 <code>$(H $a)</code> — <i>нет локально</i>"
            }
          }
          if ($assetLines.Count -gt 0) {
            $lines.Add("📁 <b>Ассеты ($($assetLines.Count), $(Size $totalBytes)):</b>")
            foreach ($al in $assetLines) { $lines.Add($al) }
            $lines.Add('')
          }

          $keptCount = 0
          $delCount  = 0
          if ($env:KEPT_RELEASES)    { $keptCount = @($env:KEPT_RELEASES    -split ',' | Where-Object { $_ }).Count }
          if ($env:DELETED_RELEASES) { $delCount  = @($env:DELETED_RELEASES -split ',' | Where-Object { $_ }).Count }
          if ($keptCount -gt 0 -or $delCount -gt 0) {
            if ($delCount -gt 0) {
              $lines.Add("🗑️ Оставлено <b>$keptCount</b> релизов · удалено <b>$delCount</b>")
            } else {
              $lines.Add("🗑️ Оставлено <b>$keptCount</b> релизов · лишних нет 👌")
            }
            $lines.Add('')
          }

          $sha = ''
          if ($env:GITHUB_SHA_SHORT) {
            $sha = $env:GITHUB_SHA_SHORT.Substring(0, [Math]::Min(7, $env:GITHUB_SHA_SHORT.Length))
          }
          $triggerEmoji = '⚡'
          if ($env:GITHUB_EVENT_NAME -eq 'schedule')          { $triggerEmoji = '⏰' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $triggerEmoji = '👆' }
          if ($env:GITHUB_EVENT_NAME -eq 'push')              { $triggerEmoji = '⬆️' }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request')      { $triggerEmoji = '🔀' }

          $triggerLine = "$triggerEmoji <b>$env:GITHUB_EVENT_NAME</b>"
          if ($env:GITHUB_TRIGGERING_ACTOR) { $triggerLine += " by <code>$(H $env:GITHUB_TRIGGERING_ACTOR)</code>" }
          if ($env:GITHUB_REF_NAME)         { $triggerLine += " · <code>$(H $env:GITHUB_REF_NAME)</code>" }
          if ($sha)                         { $triggerLine += "@<code>$sha</code>" }
          $triggerLine += " · #$env:GITHUB_RUN_NUMBER"
          $lines.Add($triggerLine)

          $links = @("🔗 <a href='$runUrl'>Прогон</a>")
          if ($relUrl) { $links += "· <a href='$relUrl'>Релиз</a>" }
          $lines.Add(($links -join ' '))

          $text = $lines -join "`n"
          if ($text.Length -gt 4000) { $text = $text.Substring(0, 3996) + '…' }

          $body = @{
            chat_id                  = $env:TELEGRAM_CHAT_ID
            text                     = $text
            parse_mode               = 'HTML'
            disable_web_page_preview = $true
          } | ConvertTo-Json -Compress

          $resp = Invoke-RestMethod -Method Post -TimeoutSec 30 `
            -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
            -ContentType 'application/json; charset=utf-8' `
            -Body ([System.Text.Encoding]::UTF8.GetBytes($body))

          if (-not $resp.ok) {
            throw "Telegram не принял сообщение: $($resp | ConvertTo-Json -Compress)"
          }
          Write-Host "Уведомление отправлено в чат $env:TELEGRAM_CHAT_ID ($($text.Length) символов)"
